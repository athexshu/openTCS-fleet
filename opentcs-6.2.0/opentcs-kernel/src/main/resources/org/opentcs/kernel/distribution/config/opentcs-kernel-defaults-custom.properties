example.statisticscollector.enable=true
 
commadapter.vehicle.vda5050.enabledVersions = 1.1, 2.0
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel = AUTOMATIC=LEAVE_UNCHANGED, SEMIAUTOMATIC=LEAVE_UNCHANGED, SERVICE=LEAVE_UNCHANGED, MANUAL=LEAVE_UNCHANGED, TEACHIN=LEAVE_UNCHANGED
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder = AUTOMATIC=false, SEMIAUTOMATIC=false, SERVICE=false, MANUAL=false, TEACHIN=false
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition = AUTOMATIC=false, SEMIAUTOMATIC=false, SERVICE=false, MANUAL=false, TEACHIN=false
commadapter.vehicle.vda5050.mqtt.brokerHost = 127.0.0.1
commadapter.vehicle.vda5050.mqtt.brokerPort = 1883
commadapter.vehicle.vda5050.mqtt.connectionEncrypted = false
commadapter.vehicle.vda5050.mqtt.username =
commadapter.vehicle.vda5050.mqtt.password =
commadapter.vehicle.vda5050.mqtt.clientId = ARAPL_FMS-vda5050-driver
commadapter.vehicle.vda5050.mqtt.keepAliveInterval = 10000
commadapter.vehicle.vda5050.mqtt.reconnectInterval = 10000

# Robot-type routing: block a path for a routing group with
# tcs:routingCostForward<group> = Infinity. Unmarked paths add no cost.
defaultrouter.shortestpath.edgeEvaluators = DISTANCE,EXPLICIT_PROPERTIES
defaultrouter.edgeevaluator.explicitproperties.defaultValue = 0

# Order database (opentcs-kernel-extension-order-database): writes every transport order change
# to PostgreSQL. To switch it on, set orderdatabase.enable = true and orderdatabase.password in
# config/opentcs-kernel.properties. Changes take effect when the kernel is restarted.
orderdatabase.enable = false
orderdatabase.jdbcUrl = jdbc:postgresql://localhost:5432/fms_orders
orderdatabase.username = fms_orders
orderdatabase.password =
orderdatabase.queueCapacity = 10000